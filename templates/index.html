<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeAlpha FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>CodeAlpha FAQ Chatbot</h1>
      <div id="chat" class="chat-window"></div>

      <form id="ask-form" class="ask-form">
        <input id="question" type="text" placeholder="Type your question here..." autocomplete="off">
        <button type="submit">Ask</button>
      </form>

      <div class="note">Tip: Edit <code>app.py</code> to customize the FAQS list.</div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
