<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAQ Admin - CodeAlpha FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>FAQ Admin</h1>

      <section>
        <h2>Add FAQ</h2>
        <form id="add-form">
          <input id="new-question" type="text" placeholder="Question" required>
          <input id="new-answer" type="text" placeholder="Answer" required>
          <button type="submit">Add</button>
        </form>
      </section>

      <section>
        <h2>Existing FAQs</h2>
        <div id="faqs"></div>
      </section>

      <div style="margin-top:12px"><a href="/">Back to chat</a></div>
    </div>

    <script src="{{ url_for('static', filename='admin.js') }}"></script>
  </body>
</html>
